<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A.Z Construction — ניהול פרויקטים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#f4f3ef; --card:#fff; --ink:#1c2026; --ink2:#4b535d; --muted:#858c95; --line:#e4e1d9; --soft:#f0eee8;
  --accent:#1b8a4b; --accent-soft:#e7f5ec; --accent-dark:#126b39; --black:#0c0e0d; --red:#c8372d; --red-soft:#fdecea; --amber:#a86200; --amber-soft:#fff2d9;
  --green:#2f7d4f; --green-soft:#e5f3ea; --blue:#2b5fb4; --blue-soft:#e8effb;
}
*{box-sizing:border-box}
body{margin:0;font-family:Heebo,Arial,sans-serif;font-size:15px;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{margin:0}
.hidden{display:none!important}
.muted{color:var(--muted)} .sm{font-size:13px}
.ro .edit-only{display:none!important}

header{background:var(--black);color:#fff;border-bottom:3px solid var(--accent)}
.hwrap{max-width:1100px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:12px}
.hlogo{height:50px;background:#fff;border-radius:8px;padding:3px 8px;display:block}
.logo{width:40px;height:40px;border-radius:9px;background:var(--accent);color:#1c2026;display:grid;place-items:center;font-weight:800;font-size:15px;direction:ltr}
.brand b{display:block;white-space:nowrap;font-size:18px;font-weight:700;direction:ltr;text-align:right;letter-spacing:.2px}
.brand span{font-size:12.5px;color:#a3a9b1}
.spacer{flex:1}
.hbtn{white-space:nowrap;background:#1d221f;border:0;color:#fff;border-radius:8px;padding:9px 14px;font-weight:600;display:inline-flex;gap:7px;align-items:center}
.hbtn:hover{background:#2a312c}
.hbtn.primary{background:var(--accent);color:#fff}
.hbtn.primary:hover{background:var(--accent-dark)}
.hbtn svg{width:18px;height:18px}

.tabsbar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.tabswrap{max-width:1100px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:10px}
.tabs{flex:1;min-width:0;display:flex;gap:2px;overflow-x:auto}
.psearch{position:relative;flex:0 0 175px}
.psearch .in{padding:7px 10px;font-size:14px}
.pqres{position:absolute;top:40px;left:0;width:320px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.12);z-index:30;max-height:360px;overflow:auto}
.pqres button{display:flex;flex-direction:column;align-items:flex-start;width:100%;border:0;background:none;padding:9px 12px;text-align:right;border-bottom:1px solid var(--soft)}
.pqres button:hover,.pqres button.hl{background:var(--accent-soft)}
.pqres .muted{font-size:12.5px}
.sortbar{display:flex;align-items:center;gap:8px;margin:0 0 10px;flex-wrap:wrap}
.urg{font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.urg.u0{background:#eef6f1;color:#3f6b51}.urg.u1{background:var(--amber-soft);color:var(--amber)}.urg.u2{background:#fde3df;color:#b4231a}.urg.u3{background:#b4231a;color:#fff}
.urg.none{background:var(--soft);color:var(--muted);font-weight:600}
.folders{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.folder{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:700}
.folder:hover{border-color:var(--accent)}
.folder.on{background:var(--black);border-color:var(--black);color:#fff}
.folder .c{font-size:12px;font-weight:600;background:var(--soft);color:var(--muted);border-radius:20px;padding:1px 8px}
.folder.on .c{background:#2b322e;color:#cfe9da}
.dirsearch{position:relative;margin-bottom:12px}
.dirsearch .in{padding:12px 40px 12px 14px;font-size:16px;border-radius:10px}
.dirsearch svg{position:absolute;right:12px;top:13px;width:20px;height:20px;color:var(--muted)}
.synced{font-size:11.5px;color:var(--accent-dark);background:var(--accent-soft);border-radius:20px;padding:2px 8px;font-weight:600}
.tab{border:0;background:none;padding:14px 8px 12px;font-size:14px;font-weight:600;color:var(--ink2);border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{width:22px;height:22px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:12px;font-weight:700}
.tab.on .n{background:var(--accent);color:#fff}
.tab .c{font-size:12px;background:var(--soft);border-radius:20px;padding:1px 8px;color:var(--muted)}
.tab.home{font-weight:700}
.tab .sep{width:1px;height:20px;background:var(--line)}

#banner:empty{display:none}
#banner{max-width:1060px;margin:14px auto 0;padding:10px 14px;border-radius:8px;background:var(--amber-soft);color:#6b4200;font-size:13.5px}
main{max-width:1100px;margin:0 auto;padding:22px 20px 80px}

.stage-h{margin-bottom:16px}
.stage-h h1{font-size:22px;font-weight:700}
.stage-h p{margin:4px 0 0;color:var(--ink2)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:8px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.pcard:hover{border-color:#c9c4b8}
.pcard h3{font-size:17px;font-weight:700}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--soft);color:var(--ink2);white-space:nowrap}
.chip.red{background:var(--red-soft);color:var(--red)} .chip.amber{background:var(--amber-soft);color:var(--amber)} .chip.green{background:var(--green-soft);color:var(--green)}
.bar{height:6px;background:var(--soft);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}
.pcard .foot{display:flex;justify-content:space-between;align-items:center;margin-top:4px;border-top:1px solid var(--soft);padding-top:10px}
.empty{background:#fff;border:1px dashed var(--line);border-radius:12px;text-align:center;padding:40px 20px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}

/* home */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat .k{font-size:13px;color:var(--muted);font-weight:600}
.stat .v{font-size:26px;font-weight:800;margin-top:2px}
.stat .v.red{color:var(--red)}
.pipe{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:16px}
.pipe .insp{background:var(--blue-soft);border-color:#c9d8f2}
.pipe .insp .pl{color:var(--blue)}
.seg{display:inline-flex;background:var(--soft);border-radius:8px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:6px;font-weight:600;font-size:14px;color:var(--ink2)}
.seg button.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.1);color:var(--ink)}
.k-insp{background:#e2f3f3;color:#0b6c6c}
.hbtn.on{background:#26352c;box-shadow:inset 0 -3px 0 var(--accent)}
@media (max-width:1240px){ .who{display:none} }
.tplcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.tplcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;display:flex;gap:14px;align-items:flex-start;text-align:right}
.tplcard:hover{border-color:var(--accent)}
.tplcard .ti{width:44px;height:54px;border-radius:6px;background:var(--red-soft);color:var(--red);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.tplcard h3{font-size:16px;font-weight:700;margin-bottom:4px}
.docform{max-width:760px}
.docform .fs{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.docform .fs h2{font-size:16px;font-weight:700;margin-bottom:12px}
.docform .req{color:var(--red)}
.sigpad{border:1px dashed #b9b3a5;border-radius:8px;background:#fffefb;touch-action:none;width:100%;max-width:420px;height:130px;display:block;cursor:crosshair}
.qitem{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.qitem .qn{min-width:36px;font-weight:700;padding-top:9px;color:var(--ink2)}
.qitem textarea{flex:1;min-height:42px}
.qauto{flex:1;background:var(--soft);border-radius:8px;padding:9px 11px;color:var(--ink2)}
table.qpay{width:100%;border-collapse:collapse}
.qpay th{text-align:right;font-size:13px;color:var(--muted);font-weight:600;padding:4px}
.qpay td{padding:4px;vertical-align:middle}
.qpay .qamt{font-weight:600;white-space:nowrap}
.qpay .qtot td{font-weight:800;border-top:2px solid var(--line);padding-top:8px}
.qpay .bad{color:var(--red)}
.pctin{display:flex;align-items:center;gap:4px}.pctin .in{text-align:center}
.qfixed{background:#faf9f6}.qfixed ul,.qfixed ol{margin:6px 0 0;padding-right:20px;line-height:1.8;color:var(--ink2)}
.dfoot{position:sticky;bottom:0;background:var(--bg);padding:12px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line)}
.xc{display:grid;grid-template-columns:110px 1fr 1fr 32px;gap:6px 8px;align-items:center;padding:6px 0;border-top:1px solid var(--soft)}
.xc .em{grid-column:2/4}
.g3{display:grid;grid-template-columns:110px 1fr 1fr;gap:6px 8px;align-items:center;padding:6px 0;border-top:1px solid var(--soft)}
.g3:first-child{border-top:0}
.g3 .em{grid-column:2/4}
.em{direction:ltr;text-align:right}
.xc .in{padding:7px 9px}
.xcadd{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.sitegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.panel.mid{width:min(680px,100%);background:#fff}
.xcrow{display:grid;grid-template-columns:1fr 1fr 1fr 1.2fr 32px;gap:6px;margin-bottom:6px}
button.step{font:inherit;text-align:right;cursor:pointer}
button.step:hover{border-color:var(--accent)}
button.step:disabled{cursor:default}
.inspbox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.report{padding:12px 0;border-top:1px solid var(--soft)}
.report:first-of-type{border-top:0}
.report .rh{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.report .rh b{font-size:14px}
.report .rt{white-space:pre-wrap;line-height:1.55}
.lastrep{font-size:13px;color:var(--ink2);background:var(--soft);border-radius:8px;padding:6px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.typesel{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.typesel label{border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:flex-start;font-size:14px}
.typesel label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.typesel small{display:block;color:var(--muted);font-size:12px}
.pipe button{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:right;display:flex;flex-direction:column;gap:2px}
.pipe button:hover{border-color:var(--accent)}
.pipe .pn{font-size:24px;font-weight:800}
.pipe .pl{font-size:13px;color:var(--ink2);font-weight:600}
table.tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl th{font-size:12.5px;color:var(--muted);font-weight:600;text-align:right;padding:10px 14px;background:#faf9f6;border-bottom:1px solid var(--line)}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--soft);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:#fbfaf7}
.segs{display:flex;gap:3px;margin-bottom:4px}
.segs i{width:22px;height:6px;border-radius:3px;background:var(--soft)}
.segs i.on{background:var(--green)} .segs i.cur{background:var(--accent)}
.sec-h{font-size:17px;font-weight:700;margin:22px 0 10px}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#c4bfb3}
.btn.primary{background:var(--black);border-color:var(--black);color:#fff}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.accent:hover{background:var(--accent-dark);border-color:var(--accent-dark)}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.link{border:0;background:none;padding:6px 4px;color:var(--ink2)}
.btn.link:hover{color:var(--ink);text-decoration:underline}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.icon{border:0;background:none;width:32px;height:32px;border-radius:7px;display:inline-grid;place-items:center;color:var(--muted);flex:none}
.icon:hover{background:var(--soft);color:var(--red)}
.icon svg{width:17px;height:17px}
.in{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:inherit;background:#fff;color:var(--ink)}
.in:focus{outline:2px solid rgba(27,138,75,.25);border-color:var(--accent)}
textarea.in{resize:vertical;line-height:1.5}
input[type=date].in,input[type=time].in,input[type=tel].in,input[type=number].in{direction:rtl;text-align:right}
label.f{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.ptop{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.ptop h1{font-size:26px;font-weight:800}
.steps{display:flex;gap:6px;margin:6px 0 18px;flex-wrap:wrap}
.step{flex:1;min-width:120px;padding:8px 10px;border-radius:8px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted);display:flex;gap:7px;align-items:center}
.step .d{width:20px;height:20px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:11px;flex:none}
.step.done{color:var(--ink2)} .step.done .d{background:var(--green);color:#fff}
.step.cur{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)} .step.cur .d{background:var(--accent);color:#fff}
.donebar{background:var(--green-soft);border:1px solid #bfe0cb;color:var(--green);border-radius:10px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px;font-weight:600}
.pgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.box h2{font-size:16px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.box h2 .muted{font-weight:500;font-size:13px}
.task{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--soft)}
.task:first-child{border-top:0}
.task input[type=checkbox]{width:19px;height:19px;accent-color:var(--green);flex:none}
.task .t{flex:1;min-width:0}
.task .date{flex:0 0 140px}
.task.late .date{border-color:#efb4ae;background:var(--red-soft);color:var(--red)}
.arch{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.arch summary{cursor:pointer;font-weight:600;color:var(--ink2);font-size:14px;padding:4px 0}
.arch .task .t{text-decoration:line-through;color:var(--muted)}
.add{display:flex;gap:8px;margin-top:10px}
.add .in{flex:1}
.doc{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--soft)}
.doc:first-child{border-top:0}
.doc .ic{width:30px;height:36px;border-radius:5px;background:var(--red-soft);color:var(--red);display:grid;place-items:center;font-size:10px;font-weight:800;flex:none}
.doc .nm{flex:1;border:0;background:none;padding:0;text-align:right;font-weight:600;word-break:break-word}
.doc .nm:hover{text-decoration:underline;color:var(--blue)}
.sum{display:flex;justify-content:space-between;margin-top:12px;font-size:14px}
.sum b{font-size:18px}
.hint{background:var(--soft);border-radius:8px;padding:9px 12px;font-size:13px;color:var(--ink2);margin-top:10px;line-height:1.5}
.hint button{border:0;background:none;padding:0;color:var(--blue);font-weight:600;text-decoration:underline}
.cline{display:flex;gap:8px;flex-wrap:wrap}
.cline .in{flex:1 1 100%;direction:ltr;text-align:left}

.ov{position:fixed;inset:0;z-index:50;background:rgba(15,17,20,.45);display:flex;justify-content:center;align-items:flex-start;padding:30px 14px;overflow:auto}
.panel{background:var(--bg);border-radius:14px;width:min(860px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.panel.narrow{width:min(520px,100%);background:#fff}
.panel.wide{width:min(980px,100%)}
.panel-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);background:#fff;border-radius:14px 14px 0 0}
.panel-h h2{font-size:19px;font-weight:700;flex:1;word-break:break-word}
.panel-b{padding:18px 20px}
.panel-f{display:flex;gap:8px;justify-content:flex-start;padding:0 20px 18px;align-items:center}
.pdfpages{display:flex;flex-direction:column;gap:12px;align-items:center}
.pdfpages canvas{max-width:100%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.12);border-radius:4px}
ol.steps-ol{margin:0;padding-right:20px;line-height:1.8}

.cal-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cal-h h3{flex:1;font-size:18px;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.dow{background:#faf9f6;text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding:6px 0}
.day{background:#fff;border:0;min-height:80px;padding:4px 5px;text-align:right;display:flex;flex-direction:column;gap:2px}
.day:hover{background:#fbfaf6}
.day.out{background:#f6f5f1}.day.out .dn{color:#bbb}
.day .dn{font-size:12.5px;font-weight:600;width:22px;height:22px;display:grid;place-items:center;border-radius:50%}
.day.today .dn{background:var(--accent);color:#fff}
.day.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.ev{font-size:11px;font-weight:600;padding:1px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-event{background:var(--blue-soft);color:var(--blue)} .k-deadline{background:var(--red-soft);color:var(--red)} .k-task{background:var(--amber-soft);color:var(--amber)}
.legend{display:flex;gap:14px;margin:10px 0 14px;font-size:13px;color:var(--ink2)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-left:5px;vertical-align:-1px}
.item{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--soft)}
.item:first-child{border-top:0}
.item .t{flex:1}
.item .tm{font-weight:700;direction:ltr;min-width:44px}

.person{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--soft)}
.person:first-child{border-top:0}
.av{width:38px;height:38px;border-radius:50%;background:#e6e2d8;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;color:var(--ink2)}
.person .info{flex:1;min-width:0}
.phone{direction:ltr;unicode-bidi:embed;font-weight:600;color:var(--blue);text-decoration:none}

#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;gap:12px}
.toast button{background:none;border:0;color:#5fd48f;font-weight:700;padding:0}

.login{position:fixed;inset:0;z-index:80;background:var(--black);display:grid;place-items:center;padding:20px}
.login form{background:#fff;border-radius:14px;padding:28px;width:min(380px,100%);display:grid;gap:12px}
.login h2{font-size:20px}
.login .err{color:var(--red);font-size:13.5px;min-height:18px}
.who{font-size:12.5px;color:#a3a9b1;direction:ltr}
@media (max-width:820px){
  .who{display:none}
  .pgrid{grid-template-columns:1fr}
  .hbtn span{display:none}
  .brand{display:none}
  .hwrap{gap:5px;padding:10px}
  .hbtn{padding:8px 9px}
  .hlogo{height:36px;padding:2px 5px}
  .g2{grid-template-columns:1fr}
  .g3{grid-template-columns:1fr 1fr}.g3 b{grid-column:1/-1}.g3 .em,.xc .em{grid-column:1/-1}
  .task{flex-wrap:wrap}.task .t{flex:1 1 calc(100% - 40px)}.task .date{flex:1 1 0;min-width:0;margin-right:29px}
  .day{min-height:54px}.ev{font-size:0;height:5px;padding:0}
  .stats{grid-template-columns:1fr 1fr}.pipe{grid-template-columns:repeat(2,1fr)}.inspbox{grid-template-columns:1fr}.sitegrid{grid-template-columns:1fr}.xc,.xcadd,.xcrow{grid-template-columns:1fr 1fr}.xc .icon{justify-self:end}
  .tbl .hide-m{display:none}
  .tbl td,.tbl th{padding:10px 8px}
  .tbl .chip,.tbl .urg{white-space:normal;display:inline-block}
  .folder{padding:7px 10px;font-size:14px}
  .segs i{width:14px}
  .psearch{flex:0 0 130px}.pqres{width:280px}
}
</style>

<script>
const STAGES = [
  {tab:'ייזום ואיסוף חומרים', title:'ייזום הפרויקט ואיסוף חומרים'},
  {tab:'תכנון מקדים', title:'תכנון מקדים והלבשת תכניות'},
  {tab:'סטטיקה וממ״ד', title:'חישובים סטטיים ותכנון ממ״ד לאישור פיקוד העורף'},
  {tab:'תכניות ביצוע', title:'הכנת תכניות ביצוע'},
  {tab:'פיקוח באתר', title:'פיקוח צוות התכנון באתר'},
  {tab:'סיום ומסירה', title:'סיום הפרויקט ומסירה'}
];
const LAST = STAGES.length - 1;
const WF = 2; // גרסת תהליך העבודה (6 שלבים)
const ROLES = [['architect','אדריכל'],['client','לקוח'],['contractor','קבלן'],['supervisor','מפקח באתר'],['geotech','יועץ קרקע'],['landscape','אדריכל נוף']];
const INSP_STATUS = ['ממתין לבדיקה','בדיקה נקבעה','נבדק — ממתין לאישור','אושר','נדחה — נדרש תיקון'];
const INSP_TITLE = 'אישורים ובדיקות';
const CHUNK = 560 * 1024; // בתים לכל חלק של קובץ
const TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
const CFG = window.AZ_FIREBASE || {};

/* ===== helpers ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const ymd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today = () => ymd(new Date());
const parseD = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y, m-1, d); };
const fmtD = (s, o) => s ? parseD(s).toLocaleDateString('he-IL', o || {day:'numeric', month:'numeric', year:'numeric'}) : '';
const fmtTs = t => t ? new Date(t).toLocaleDateString('he-IL') : '';
const daysTo = s => { const n = new Date(); n.setHours(0,0,0,0); return Math.round((parseD(s) - n) / 864e5); };
const ILS = new Intl.NumberFormat('he-IL', {style:'currency', currency:'ILS', maximumFractionDigits:0});
const money = v => ILS.format(Number(v) || 0);
const clone = o => (o && typeof o === 'object') ? JSON.parse(JSON.stringify(o)) : o;
const getPath = (o, p) => p.split('.').reduce((a,k) => a == null ? a : a[k], o);
const nest = (path, v) => { const o = {}; let c = o; path.forEach((k,i) => { if (i === path.length-1) c[k] = v; else c = c[k] = {}; }); return o; };
function deepMerge(t, p){ for (const k in p){ const v = p[k]; if (v && typeof v === 'object' && !Array.isArray(v) && t[k] && typeof t[k] === 'object' && !Array.isArray(t[k])) deepMerge(t[k], v); else t[k] = clone(v); } return t; }
const pct = p => p.contractAmount ? Math.round((Number(p.paidAmount)||0) / Number(p.contractAmount) * 100) : 0;
const isInsp = p => p.type === 'inspection';
const KINDS = ['וילה','בית פרטי','תוספת בנייה','מבנה תעשייה','משק חקלאי','אחר'];
const URG = ['נמוכה','בינונית','גבוהה','דחופה'];
const VILLA_MONTHS = 3;
const isVilla = p => p.kind === 'וילה';
const kindLabel = p => p.kind === 'אחר' ? ((p.kindOther||'').trim() || 'אחר') : (p.kind || '');
const isNinja = p => p.folder ? p.folder === 'ninja' : /נינג|ninja/i.test((p.facility||'') + ' ' + (p.name||''));
const addMonths = (d, m) => { const x = new Date(d); x.setMonth(x.getMonth() + m); return ymd(x); };
const projStart = p => p.startDate || ymd(new Date(p.createdAt || Date.now()));
// דחיפות: בווילות מחושבת אוטומטית לפי הזמן שנותר עד היעד; בשאר הפרויקטים נבחרת ידנית
function urgencyOf(p){
  if (isVilla(p) && p.deadline && !URG.includes(p.urgency)){
    const d = daysTo(p.deadline);
    const lvl = d <= 14 ? 3 : d <= 30 ? 2 : d <= 60 ? 1 : 0;
    return {lvl, auto:true};
  }
  const i = URG.indexOf(p.urgency);
  return {lvl: i, auto:false};
}
function urgChip(p){
  const u = urgencyOf(p);
  if (u.lvl < 0) return '<span class="urg none">דחיפות: לא נקבעה</span>';
  return `<span class="urg u${u.lvl}" title="${u.auto ? 'מחושב אוטומטית לפי הזמן שנותר עד היעד (וילה)' : isVilla(p) ? 'נקבע ידנית (במקום החישוב האוטומטי)' : 'נקבע ידנית'}">${u.auto ? '⏱ ' : isVilla(p) ? '✋ ' : ''}דחיפות ${URG[u.lvl]}</span>`;
}
function sortProjects(arr){
  const by = UI.sort || 'urgency';
  const nm = (a,b) => String(a.name||'').localeCompare(String(b.name||''), 'he');
  const dl = (a,b) => String(a.deadline||'9999').localeCompare(String(b.deadline||'9999'));
  const kr = p => { const i = KINDS.indexOf(p.kind); return i < 0 ? 99 : i; };
  return arr.slice().sort(by === 'name' ? nm
    : by === 'type' ? (a,b) => (kr(a) - kr(b)) || kindLabel(a).localeCompare(kindLabel(b), 'he') || nm(a,b)
    : by === 'status' ? (a,b) => ((a.stage||0) - (b.stage||0)) || nm(a,b)
    : (a,b) => (urgencyOf(b).lvl - urgencyOf(a).lvl) || dl(a,b) || nm(a,b));
}
function sortBar(){
  const by = UI.sort || 'urgency';
  const b = (k, l) => `<button type="button" class="${by===k?'on':''}" data-a="sortby" data-v="${k}">${l}</button>`;
  return `<div class="sortbar"><span class="muted sm">מיון לפי:</span><div class="seg">${b('urgency','דחיפות')}${b('name','שם')}${b('status','סטטוס')}${b('type','סוג פרויקט')}</div></div>`;
}
const normName = s => String(s||'').trim().replace(/\s+/g, ' ').toLowerCase();
const nameTaken = (name, exceptId) => S.projects.find(p => p.id !== exceptId && normName(p.name) === normName(name));
const active = () => S.projects.filter(p => !p.done);
const activeWf = () => active().filter(p => !isInsp(p));
const activeInsp = () => S.projects.filter(isInsp);
const nextInsp = p => p.nextInspection || p.inspDate || '';
function expChip(d){
  if (!d) return '<span class="muted">—</span>';
  const n = daysTo(d);
  if (n < 0) return `<span class="chip red">פג תוקף ב-${fmtD(d)}</span>`;
  if (n <= 30) return `<span class="chip amber">בתוקף עד ${fmtD(d)} (עוד ${n} ימים)</span>`;
  return `<span class="chip green">בתוקף עד ${fmtD(d)}</span>`;
}
function nextChip(d){
  if (!d) return '<span class="muted">—</span>';
  const n = daysTo(d);
  if (n < 0) return `<span class="chip red">${fmtD(d)} · באיחור</span>`;
  if (n <= 14) return `<span class="chip amber">${fmtD(d)} · עוד ${n} ימים</span>`;
  return `<span class="chip">${fmtD(d)}</span>`;
}
const lastReport = p => (p.reports||[]).slice().sort((a,b) => String(b.date).localeCompare(String(a.date)) || (b.at||0) - (a.at||0))[0];
function inspChip(st){ st = st || INSP_STATUS[0]; const c = st === 'אושר' ? 'green' : st.startsWith('נדחה') ? 'red' : st === INSP_STATUS[0] ? '' : 'amber'; return `<span class="chip ${c}">${esc(st)}</span>`; }
const openTasks = p => (p.subtasks||[]).filter(t => !t.done);
const lateTasks = p => openTasks(p).filter(t => t.deadline && daysTo(t.deadline) < 0);
function dueChip(d){
  if (!d) return '';
  const n = daysTo(d);
  if (n < 0) return `<span class="chip red">באיחור של ${-n} ימים</span>`;
  if (n === 0) return `<span class="chip red">היום!</span>`;
  if (n <= 14) return `<span class="chip amber">עוד ${n} ימים</span>`;
  return `<span class="chip">יעד: ${fmtD(d)}</span>`;
}

/* ===== storage ===== */
const S = { projects:[], events:[], directory:[], mode:'loading', ro:false, assets:null, downloads:null, loaded:{} };
const UI = { cal:null, dirQ:'', archOpen:false, migrated:{} };
let fbAuth = null, fs = null;
const Store = {
  db:null, local:null, cbs:{}, q:{}, started:false,
  async init(){
    const ok = CFG.apiKey && CFG.projectId && !/PASTE/i.test(CFG.apiKey) && window.firebase;
    if (!ok){
      S.mode = 'local'; try { this.local = JSON.parse(localStorage.getItem('azc-he') || 'null'); } catch(e){}
      this.local = this.local || {projects:{}, events:{}, directory:{}};
      this.startAll(); banner(); return;
    }
    S.mode = 'cloud';
    firebase.initializeApp(CFG);
    fbAuth = firebase.auth(); fs = firebase.firestore();
    this.db = fs;
    fbAuth.onAuthStateChanged(user => { if (user) this.afterLogin(user); else if (this.started) location.reload(); else showLogin(); });
  },
  afterLogin(user){
    if (this.started) return;
    $('#login').classList.add('hidden');
    $('#who').textContent = user.email || '';
    $('#logoutBtn').classList.remove('hidden');
    this.startAll(); banner();
  },
  startAll(){
    if (this.started) return; this.started = true;
    this.listen('projects', a => { S.projects = a.sort((x,y) => (y.createdAt||0) - (x.createdAt||0)); setTimeout(migrate, 0); });
    this.listen('events', a => S.events = a);
    this.listen('directory', a => S.directory = a.sort((x,y) => String(x.name).localeCompare(String(y.name), 'he')));
  },
  save(){ try { localStorage.setItem('azc-he', JSON.stringify(this.local)); } catch(e){} },
  emit(col){ const cb = this.cbs[col]; if (cb){ cb(Object.entries(this.local[col]||{}).map(([id,d]) => Object.assign(clone(d), {id}))); S.loaded[col] = true; later(); } },
  listen(col, cb){
    if (S.mode === 'local'){ this.cbs[col] = cb; this.emit(col); return; }
    const t = setTimeout(() => { if (!S.loaded[col]){ S.slow = true; banner(); } }, 10000);
    this.db.collection(col).onSnapshot(snap => {
      cb(snap.docs.map(d => Object.assign(clone(d.data()) || {}, {id:d.id}))); S.loaded[col] = true;
      if (!snap.metadata.fromCache){ clearTimeout(t); if (S.slow){ S.slow = false; banner(); } }
      later();
    }, e => { console.error(e); clearTimeout(t); S.loaded[col] = true; S.err = true; banner(); later(); });
  },
  newId(col){ return S.mode === 'cloud' ? this.db.collection(col).doc().id : rid(); },
  w(col, id, fn){
    const k = col+'/'+id;
    const run = async () => { try { await fn(); } catch(e){ if (e && e.code === 'unavailable'){ await new Promise(r => setTimeout(r, 800)); try { await fn(); return; } catch(e2){ e = e2; } } fail(e); } };
    return this.q[k] = (this.q[k] || Promise.resolve()).then(run);
  },
  set(col, id, d){ if (S.mode === 'local'){ (this.local[col] ||= {})[id] = clone(d); this.save(); this.emit(col); return Promise.resolve(); } return this.w(col, id, () => this.db.collection(col).doc(id).set(d)); },
  update(col, id, p){ if (S.mode === 'local'){ const t = (this.local[col] ||= {}); t[id] = deepMerge(t[id] || {}, p); this.save(); this.emit(col); return Promise.resolve(); } return this.w(col, id, () => this.db.collection(col).doc(id).set(p, {merge:true})); },
  remove(col, id){ if (S.mode === 'local'){ delete (this.local[col]||{})[id]; this.save(); this.emit(col); return Promise.resolve(); } return this.w(col, id, () => this.db.collection(col).doc(id).delete()); }
};

function later(){ clearTimeout(rt); rt = setTimeout(() => { if (editing()){ pending = true; renderTabs(); } else { pending = false; render(); } }, 0); }
document.addEventListener('focusout', () => setTimeout(() => { if (pending && !editing()){ pending = false; render(); } }, 0));

function route(){
  const h = location.hash.slice(1);
  if (h.startsWith('p-')) return {id:h.slice(2)};
  if (h === 'done') return {done:true};
  if (h === 'insp') return {insp:true};
  if (h === 'docs') return {docs:true};
  if (h.startsWith('doc-')) return {doc:h.slice(4)};
  const m = h.match(/^stage-([1-6])$/);
  return m ? {tab:+m[1]-1} : {home:true};
}
window.addEventListener('hashchange', () => { render(); window.scrollTo(0,0); });
const go = h => { if (location.hash.slice(1) === h) render(); else location.hash = h; };

            : `<select class="in" data-pf="urgency"><option value="">— בחר —</option>${URG.map(x => `<option ${p.urgency===x?'selected':''}>${x}</option>`).join('')}</select>`}</div>

      <div class="box"><h2>כספים</h2>

/* ===== overlays ===== */
let ovKind = null;
function openOv(kind){ ovKind = kind; $('#ov').classList.remove('hidden'); renderOv(); }
function closeOv(){ ovKind = null; $('#ov').classList.add('hidden'); $('#ov').innerHTML = ''; }
function renderOv(){
  if (ovKind !== 'calendar' && ovKind !== 'directory') return;
  const o = $('#ov');
  const keep = document.activeElement && document.activeElement.id === 'dirQ';
  o.innerHTML = `<div class="panel"><div class="panel-h"><h2>${ovKind === 'calendar' ? 'יומן' : 'אנשי קשר'}</h2><button class="btn link" data-a="close">✕ סגור</button></div>
    <div class="panel-b">${ovKind === 'calendar' ? calView() : dirView()}</div></div>`;
  lock(o);
  if (keep){ const q = $('#dirQ'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
}
function formOv({title, body, ok='שמירה', danger=false, onOk, extra='', size='narrow'}){
  ovKind = 'form';
  const o = $('#ov'); o.classList.remove('hidden');
  o.innerHTML = `<form class="panel ${size}" id="fm"><div class="panel-h"><h2>${esc(title)}</h2></div><div class="panel-b">${body}</div>
    <div class="panel-f">${ok ? `<button class="btn ${danger?'danger':'primary'}">${esc(ok)}</button>` : ''}<button type="button" class="btn" data-a="close">${ok ? 'ביטול' : 'סגור'}</button><span style="flex:1"></span>${extra}</div></form>`;
  const f = $('#fm');
  f.onsubmit = e => { e.preventDefault(); const fd = Object.fromEntries(new FormData(f)); const rows = [...f.querySelectorAll('.xcrow')].map(r => ({role:r.querySelector('[name=xrole]').value.trim(), name:r.querySelector('[name=xname]').value.trim(), phone:r.querySelector('[name=xphone]').value.trim(), email:(r.querySelector('[name=xemail]')||{value:''}).value.trim()})); const fi = f.querySelector('input[type=file]'); const files = fi ? [...fi.files] : []; closeOv(); onOk && onOk(fd, rows, files); };
  const i = f.querySelector('input:not([readonly]),textarea'); if (i) i.focus();
}
const confirmOv = (msg, fn) => formOv({title:'בטוח?', body:`<p style="margin:0">${esc(msg)}</p>`, ok:'מחק', danger:true, onOk:fn});

/* calendar */
const byDateTime = (a,b) => (a.date + (a.time||'99')).localeCompare(b.date + (b.time||'99'));
function calItems(){
  const out = [];
  S.events.forEach(e => e.date && out.push({date:e.date, time:e.time||'', title:e.title, kind:'event', id:e.id, pid:e.projectId}));
  activeInsp().forEach(p => {
    if (nextInsp(p)) out.push({date:nextInsp(p), title:'בדיקה מתוכננת · ' + (p.name||''), kind:'insp', pid:p.id});
    if (p.approvalExpiry) out.push({date:p.approvalExpiry, title:'תוקף אישור מסתיים · ' + (p.name||''), kind:'deadline', pid:p.id});
  });
  activeWf().forEach(p => {
    if (p.deadline) out.push({date:p.deadline, title:'יעד: ' + (p.name||''), kind:'deadline', pid:p.id});
    openTasks(p).forEach(t => t.deadline && out.push({date:t.deadline, title:t.title + ' · ' + (p.name||''), kind:'task', pid:p.id}));

  });
  return out;
}
const KIND = {event:'פגישה', deadline:'יעד', task:'משימה', insp:'בדיקה באתר'};
function calRow(x, inCal){
  const pr = x.pid && S.projects.find(p => p.id === x.pid);
  return `<div class="item"><span class="tm">${esc(x.time||'')}</span><span class="ev k-${x.kind}">${KIND[x.kind]}</span>
    <span class="t">${esc(x.title)}${x.kind==='event' && pr ? ` <span class="muted sm">· ${esc(pr.name)}</span>` : ''}${!inCal ? ` <span class="muted sm">· ${fmtD(x.date, {weekday:'short', day:'numeric', month:'numeric'})}</span>` : ''}</span>
    ${pr ? `<button class="btn sm" data-a="openx" data-id="${esc(pr.id)}">לפרויקט</button>` : ''}
    ${x.kind==='event' && inCal ? `<button class="icon edit-only" data-a="delev" data-id="${esc(x.id)}" title="מחק">${TRASH}</button>` : ''}</div>`;
}
function calView(){
  if (!UI.cal){ const n = new Date(); UI.cal = {y:n.getFullYear(), m:n.getMonth(), sel:today()}; }
  const {y, m, sel} = UI.cal, first = new Date(y, m, 1), dim = new Date(y, m+1, 0).getDate();
  const weeks = Math.ceil((first.getDay() + dim) / 7), start = new Date(y, m, 1 - first.getDay());
  const by = {}; calItems().sort(byDateTime).forEach(i => (by[i.date] ||= []).push(i));
  let cells = ['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'].map(d => `<div class="dow">${d}</div>`).join('');
  for (let i = 0; i < weeks*7; i++){
    const d = new Date(start); d.setDate(start.getDate()+i); const k = ymd(d), its = by[k]||[];
    cells += `<button class="day ${d.getMonth()!==m?'out':''} ${k===today()?'today':''} ${k===sel?'sel':''}" data-a="day" data-d="${k}"><span class="dn">${d.getDate()}</span>${its.slice(0,3).map(x => `<span class="ev k-${x.kind}">${x.time ? esc(x.time) + ' ' : ''}${esc(x.title)}</span>`).join('')}${its.length>3?`<span class="muted" style="font-size:11px">+${its.length-3}</span>`:''}</button>`;
  }
  return `<div class="cal-h"><h3>${first.toLocaleDateString('he-IL', {month:'long', year:'numeric'})}</h3>
      <button class="btn sm" data-a="mon" data-d="-1">→</button><button class="btn sm" data-a="mon" data-d="0">היום</button><button class="btn sm" data-a="mon" data-d="1">←</button></div>
    <div class="cal">${cells}</div>
    <div class="legend"><span><i class="k-event"></i>פגישות</span><span><i class="k-deadline"></i>יעדי פרויקטים</span><span><i class="k-task"></i>משימות</span><span><i class="k-insp"></i>בדיקות באתר</span></div>
    <div class="box" style="margin:0"><h2>${fmtD(sel, {weekday:'long', day:'numeric', month:'long'})}</h2>
      ${(by[sel]||[]).map(x => calRow(x, true)).join('') || '<div class="muted sm">אין כלום ביום הזה.</div>'}
      <form class="edit-only" data-f="event" style="margin-top:14px;border-top:1px solid var(--soft);padding-top:14px">
        <label class="f">הוספת פגישה ביום הזה</label>
        <div class="add" style="margin:0;flex-wrap:wrap">
          <input class="in" name="title" placeholder="נושא הפגישה…" required style="flex:2 1 220px">
          <input class="in" type="time" name="time" style="flex:0 0 120px" title="שעה">
          <select class="in" name="projectId" style="flex:1 1 160px"><option value="">ללא פרויקט</option>${S.projects.filter(p => !p.done).map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select>
          <button class="btn primary">הוסף</button>
        </div>
      </form>
    </div>`;
}

/* אנשי קשר: הרשימה הראשית + אנשי מקצוע מתוך הפרויקטים (מסונכרנים אוטומטית). לקוחות לא נכנסים לכאן. */
const isClientRole = r => /לקוח|מזמין|בעל(ת|י)? הבית|בעלים/.test(String(r||''));
const phoneKey = ph => String(ph||'').replace(/\D/g, '').replace(/^972/, '0');
function proContacts(){
  const out = [];
  S.projects.forEach(p => {
    const add = (c, role) => { const name = (c.name||'').trim(), phone = (c.phone||'').trim(), email = (c.email||'').trim(); if (name || phone || email) out.push({name, phone, email, role, p}); };
    ROLES.forEach(([k, label]) => { if (k !== 'client') add(getPath(p, 'contacts.' + k) || {}, label); });
    (p.extraContacts||[]).forEach(c => { if (!isClientRole(c.role)) add(c, (c.role||'').trim()); });
  });
  return out;
}
function dirEntries(){
  const map = new Map(), keyOf = c => phoneKey(c.phone) || (c.name ? 'n:' + normName(c.name) : 'e:' + String(c.email||'').toLowerCase());
  S.directory.forEach(c => map.set(keyOf(c), Object.assign({projects:[], roles:new Set(c.role ? [c.role] : []), manual:true}, c)));
  proContacts().forEach(c => {
    const k = keyOf(c);
    let e = map.get(k);
    if (!e && c.name){ for (const x of map.values()) if (!phoneKey(x.phone) && normName(x.name) === normName(c.name)){ e = x; break; } }
    if (!e && c.email){ for (const x of map.values()) if (x.email && x.email.toLowerCase() === c.email.toLowerCase()){ e = x; break; } }
    if (!e){ e = {name:c.name, phone:c.phone, email:c.email, projects:[], roles:new Set(), manual:false}; map.set(k, e); }
    if (!e.name && c.name) e.name = c.name; if (!e.phone && c.phone) e.phone = c.phone; if (!e.email && c.email) e.email = c.email;
    if (c.role) e.roles.add(c.role);
    if (!e.projects.some(x => x.id === c.p.id)) e.projects.push(c.p);
  });
  return [...map.values()].sort((a,b) => String(a.name||'').localeCompare(String(b.name||''), 'he'));
}
function dirList(){
  const q = normName(UI.dirQ), f = UI.dirF || 'all';
  const rank = c => { const n = normName(c.name); return !q ? 0 : n.startsWith(q) || n.split(' ').some(w => w.startsWith(q)) ? 0 : n.includes(q) ? 1 : 2; };
  const list = dirEntries().filter(c => (f === 'all' || (f === 'pro' ? c.projects.length : c.manual))
    && (!q || [c.name, c.phone, c.email, [...c.roles].join(' '), c.projects.map(p => p.name).join(' ')].some(v => normName(v).includes(q))))

}

/* PDF documents — נשמרים בתוך Firestore בחלקים (עובד בתוכנית החינמית של Firebase) */
const fmtSize = b => !b ? '' : b > 1048576 ? (b/1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(b/1024)) + 'KB';
function toB64(u8){ let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
async function loadPdf(d){
  if (!d.fid){ throw new Error('old'); }
  const meta = await fs.collection('files').doc(d.fid).get();
  if (!meta.exists) throw new Error('missing');
  const n = meta.data().chunks;
  const parts = await Promise.all(Array.from({length:n}, (_, i) => fs.collection('fileChunks').doc(d.fid + '_' + i).get()));
  const bytes = parts.map(x => { const b = atob(x.data().data); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; });
  return new Blob(bytes, {type:'application/pdf'});
}
async function viewDoc(d, download){
  if (!d.fid){ toast('המסמך הזה הועלה בגרסה קודמת ולא נשמר — העלה אותו מחדש.'); return; }
  const w = download ? null : window.open('', '_blank');
  if (w) w.document.write('<p style="font-family:Arial;direction:rtl;padding:20px">טוען את המסמך…</p>');
  try {
    const blob = await loadPdf(d); const url = URL.createObjectURL(blob);
    if (w) w.location.href = url;
    else { const a = document.createElement('a'); a.href = url; a.download = d.name; document.body.appendChild(a); a.click(); a.remove(); }
    setTimeout(() => URL.revokeObjectURL(url), 120000);
  } catch(e){ console.error(e); if (w) w.close(); toast('לא הצלחנו לפתוח את המסמך'); }
}
async function deleteFile(fid){
  if (!fs || !fid) return;
  try { const m = await fs.collection('files').doc(fid).get(); const n = m.exists ? m.data().chunks : 0;
    for (let i = 0; i < n; i++) await fs.collection('fileChunks').doc(fid + '_' + i).delete();
    await fs.collection('files').doc(fid).delete(); } catch(e){ console.error(e); }
}

function docFieldHtml(f, saved){

function initDocForm(id){
  const c = $('#sigpad'); if (!c || c.dataset.init) return; c.dataset.init = '1';
  const ctx = c.getContext('2d'); ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0b2a6b';
  let drawing = false;
  const pos = e => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height]; };
  c.addEventListener('pointerdown', e => { drawing = true; c.setPointerCapture(e.pointerId); const [x,y] = pos(e); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x+0.1, y+0.1); ctx.stroke(); c.dataset.dirty = '1'; });
  c.addEventListener('pointermove', e => { if (!drawing) return; const [x,y] = pos(e); ctx.lineTo(x, y); ctx.stroke(); });
  ['pointerup','pointercancel','pointerleave'].forEach(ev => c.addEventListener(ev, () => { drawing = false; }));
}

function visualOrder(s){
  const chars = [...String(s)];

function bidiItems(items){
  const isR = c => /[֐-׿יִ-ﭏ]/.test(c), isL = c => /[A-Za-z0-9À-ɏ]/.test(c);
  const ty = items.map(it => isR(it.c) ? 'R' : isL(it.c) ? 'L' : 'N');
  items.forEach((it, i) => { if (it.c === '%' && i > 0 && /[0-9]/.test(items[i-1].c)) ty[i] = 'L'; });
  for (let i = 0; i < ty.length; i++) if (ty[i] === 'N'){
    let j = i; while (j < ty.length && ty[j] === 'N') j++;
    const prev = i > 0 ? ty[i-1] : 'R', next = j < ty.length ? ty[j] : 'R';
    // מספרים עם פסיק/נקודה/מקף ביניהם נשארים יחד (19,000 / 1.1-1.7)
    const t = prev === next ? prev : 'R';
    for (let k = i; k < j; k++) ty[k] = t; i = j - 1;
  }
  const runs = []; items.forEach((it, i) => { const last = runs[runs.length-1]; if (last && last.t === ty[i]) last.s.push(it); else runs.push({t:ty[i], s:[it]}); });
  const MIR = {'(':')', ')':'(', '[':']', ']':'[', '<':'>', '>':'<', '{':'}', '}':'{'};
  return runs.reverse().flatMap(r => r.t === 'R' ? r.s.reverse().map(it => MIR[it.c] ? Object.assign({}, it, {c:MIR[it.c]}) : it) : r.s);
}

function richItems(text, base={}){
  const out = []; let bold = false;
  String(text).split('**').forEach((part, i) => { if (i > 0) bold = !bold; for (const c of part) out.push(Object.assign({c, b: bold || !!base.b, u: !!base.u})); });
  return out;
}

const XLSX_URL = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
async function exportNinjaXlsx(){
  const sites = activeInsp().filter(isNinja).sort((a,b) => String(a.approvalExpiry||'9999').localeCompare(String(b.approvalExpiry||'9999')));
  if (!sites.length){ toast('אין מתקני נינג׳ה לייצוא'); return; }
  try {
    if (!window.XLSX) await loadScript(XLSX_URL);
    const D = s => s ? parseD(s) : '';
    const apStatus = p => !p.approvalExpiry ? 'לא הוזן' : daysTo(p.approvalExpiry) < 0 ? 'פג תוקף' : daysTo(p.approvalExpiry) <= 30 ? 'בתוקף — פג בקרוב' : 'בתוקף';
    const inStatus = p => { const d = nextInsp(p); return !d ? 'לא נקבעה' : daysTo(d) < 0 ? 'באיחור' : daysTo(d) <= 14 ? 'בשבועיים הקרובים' : 'מתוכננת'; };
    const head = ['שם האתר','כתובת','סוג מתקן / ציוד','בדיקה אחרונה','תוקף האישור','סטטוס האישור','ימים עד פקיעת האישור','בדיקה הבאה','סטטוס הבדיקה','אנשי קשר','דוחות פיקוח','הערות'];
    const rows = sites.map(p => [p.name||'', p.location||'', p.facility||'', D(p.lastInspection), D(p.approvalExpiry), apStatus(p),
      p.approvalExpiry ? daysTo(p.approvalExpiry) : '', D(nextInsp(p)), inStatus(p),
      (p.extraContacts||[]).map(c => [c.role, c.name, c.phone, c.email].filter(Boolean).join(' ')).join(' | '), (p.docs||[]).length, p.description||'']);
    const ws = XLSX.utils.aoa_to_sheet([head].concat(rows), {cellDates:true, dateNF:'dd/mm/yyyy'});
    ws['!cols'] = [26,24,22,13,13,17,12,13,17,44,10,30].map(w => ({wch:w}));
    ws['!autofilter'] = {ref: XLSX.utils.encode_range({s:{r:0, c:0}, e:{r:rows.length, c:head.length - 1}})};
    for (let r = 1; r <= rows.length; r++) [3,4,7].forEach(c => { const cell = ws[XLSX.utils.encode_cell({r, c})]; if (cell && cell.t === 'd') cell.z = 'dd/mm/yyyy'; });
    const wb = XLSX.utils.book_new();
    wb.Workbook = {Views:[{RTL:true}]};
    XLSX.utils.book_append_sheet(wb, ws, 'מתקני נינג׳ה');
    XLSX.writeFile(wb, `מתקני נינג'ה - אישורים ובדיקות - ${fmtD(today()).replace(/\./g, '-')}.xlsx`, {cellDates:true});
    toast(`קובץ אקסל עם ${sites.length} מתקנים הורד`);
  } catch(e){ console.error(e); toast('הייצוא לאקסל נכשל — בדוק את החיבור לאינטרנט ונסה שוב.'); }
}

async function upload(files, pid){
  const p = S.projects.find(x => x.id === pid) || curP(); if (!p || S.mode !== 'cloud') return;
  const pdfs = [...files].filter(f => f.type === 'application/pdf' || /\.pdf$/i.test(f.name));
  if (!pdfs.length){ toast('אפשר לצרף קבצי PDF בלבד.'); return; }
  const added = [];
  for (const f of pdfs){
    if (f.size > 25*1048576){ toast(`${f.name} גדול מ-25MB — אי אפשר לצרף אותו.`); continue; }
    const fid = fs.collection('files').doc().id;
    try {
      const u8 = new Uint8Array(await f.arrayBuffer()); const n = Math.max(1, Math.ceil(u8.length / CHUNK));
      for (let i = 0; i < n; i++){
        toast(`מעלה את ${f.name}… ${Math.round(i / n * 100)}%`);
        await fs.collection('fileChunks').doc(fid + '_' + i).set({fid, i, data: toB64(u8.subarray(i*CHUNK, (i+1)*CHUNK))});
      }
      await fs.collection('files').doc(fid).set({name:f.name, size:f.size, chunks:n, projectId:p.id, at:Date.now(), by:(fbAuth && fbAuth.currentUser && fbAuth.currentUser.email) || ''});
      added.push({id:fid, fid, name:f.name, size:f.size, at:Date.now()});
    } catch(e){ console.error(e); toast(`ההעלאה של ${f.name} נכשלה`); deleteFile(fid); }
  }
  if (added.length){ const cur = S.projects.find(x => x.id === p.id) || p; await upd(cur, {docs:(cur.docs||[]).concat(added)}); toast(added.length > 1 ? `${added.length} מסמכים צורפו` : 'המסמך צורף'); }
}

  insptab: () => { closeOv(); go('insp'); },
  open: el => go('p-' + el.dataset.id),
  openx: el => { closeOv(); go('p-' + el.dataset.id); },
  calendar: () => openOv('calendar'),
  directory: () => openOv('directory'),
  close: () => closeOv(),
  new: el => newProjectForm({}),
  sitefolder: el => { UI.siteFolder = el.dataset.v; UI.siteFilter = 'all'; render(); },
  ninjaxls: () => exportNinjaXlsx(),
  dirf: el => { UI.dirF = el.dataset.v; renderOv(); },
  sortby: el => { UI.sort = el.dataset.v; render(); },
  pqgo: el => { const i = $('#pq'); if (i){ i.value = ''; i.blur(); } $('#pqres').classList.add('hidden'); closeOv(); go('p-' + el.dataset.id); },
  dupopen: el => { closeOv(); go('p-' + el.dataset.id); },
  edit: el => { const p = S.projects.find(x => x.id === el.dataset.id); if (!p) return;
      formOv({title:'עריכת פרטים', body:pForm(p), extra:`<button type="button" class="btn link" style="color:var(--red)" data-a="delp" data-id="${esc(p.id)}">מחק פרויקט</button>`,
        onOk: fd => { const dup = nameTaken(fd.name, p.id); if (dup){ setTimeout(() => dupWarning(fd.name, dup, () => A.edit({dataset:{id:p.id}})), 0); return; }
          upd(p, {name:fd.name.trim(), clientName:fd.clientName.trim(), location:fd.location.trim()}); }}); },
  delp: el => { const p = S.projects.find(x => x.id === el.dataset.id); if (!p) return; closeOv();
      confirmOv(`למחוק את "${p.name}"? לא ניתן לבטל.`, () => { (p.docs||[]).forEach(d => d.fid && deleteFile(d.fid)); Store.remove('projects', p.id); go(''); toast('הפרויקט נמחק'); }); },
  move: (el, e) => { e.stopPropagation(); moveStage(el.dataset.id, +el.dataset.to); },
  addsite: () => formOv({title:'הוספת אתר', size:'mid', ok:'שמור אתר', body:siteForm(), onOk: (fd, rows, files) => {
      const dup = nameTaken(fd.name); if (dup){ setTimeout(() => dupWarning(fd.name, dup, () => A.addsite()), 0); return; }
      const id = Store.newId('projects');
      Store.set('projects', id, {type:'inspection', folder: fd.folder || 'other', name:fd.name.trim(), location:fd.location.trim(), facility:fd.facility.trim(), lastInspection:fd.lastInspection||'', approvalExpiry:fd.approvalExpiry||'', nextInspection:fd.nextInspection||'',
        extraContacts: rows.filter(r => r.role || r.name || r.phone || r.email).map(r => Object.assign({id:rid()}, r)), docs:[], description:'', done:false, wf:WF, createdAt:Date.now(), updatedAt:Date.now()});
      go('p-' + id); toast('האתר נוסף');
      if (files.length) setTimeout(() => upload(files, id), 300); }}),
  docs: () => { closeOv(); go('docs'); },
  opentpl: el => go('doc-' + el.dataset.t),
  qtype: el => { UI.q = newQuote(el.dataset.v); saveQDraft(); rerenderQuote(); window.scrollTo(0,0); },
  qresume: () => { UI.q = loadQDraft(); rerenderQuote(); },
  qreset: () => formOv({title:'הצעה חדשה', ok:'התחל מחדש', danger:true, body:'<p style="margin:0">הטיוטה הנוכחית תימחק. להמשיך?</p>', onOk: () => { UI.q = null; try { localStorage.removeItem(QDRAFT); } catch(e){} rerenderQuote(); window.scrollTo(0,0); }}),
  qadd: el => { const l = el.dataset.l; if (l === 'pay') UI.q.pay.push({d:'', p:0}); else getQList(l).push(''); saveQDraft(); rerenderQuote(); },
  qdel: el => { getQList(el.dataset.l).splice(+el.dataset.i, 1); saveQDraft(); rerenderQuote(); },
  qaddsec: () => { UI.q.extra.push({title:'', items:['']}); saveQDraft(); rerenderQuote(); },
  qdelsec: el => { UI.q.extra.splice(+el.dataset.i, 1); saveQDraft(); rerenderQuote(); },
  sigclear: () => { const c = $('#sigpad'); if (c){ c.getContext('2d').clearRect(0, 0, c.width, c.height); c.dataset.dirty = ''; } },
  sitefilter: el => { UI.siteFilter = el.dataset.v; render(); },
  addxcrow: () => { const box = $('#xcRows'); if (box) box.insertAdjacentHTML('beforeend', xcRowHtml()); },
  delxcrow: el => { const r = el.closest('.xcrow'); if (r) r.remove(); },
  delsite: el => { const p = S.projects.find(x => x.id === el.dataset.id); if (!p) return;
      confirmOv(`למחוק את האתר "${p.name}" ואת כל הקבצים שלו? לא ניתן לבטל.`, () => { (p.docs||[]).forEach(d => d.fid && deleteFile(d.fid)); Store.remove('projects', p.id); go('insp'); toast('האתר נמחק'); }); },
  delxc: el => { const p = curP(); if (p) upd(p, {extraContacts:(p.extraContacts||[]).filter(c => c.id !== el.dataset.xcid)}); },
  back: el => { const p = S.projects.find(x => x.id === el.dataset.id); if (p) backChooser(p); },
  goto: el => { const p = S.projects.find(x => x.id === el.dataset.id); if (!p) return; const to = +el.dataset.to;
      formOv({title: to < (p.stage||0) ? 'החזרה לשלב קודם' : 'העברה לשלב', ok:'העבר', body:`<p style="margin:0">להעביר את "${esc(p.name)}" לשלב ${to+1}: ${STAGES[to].tab}?</p>`, onOk: () => moveStage(p.id, to)}); },
  editrep: el => { const p = curP(); const r = p && (p.reports||[]).find(x => x.id === el.dataset.rid); if (!r) return;
      formOv({title:'עריכת דוח סטטוס', body:`<label class="f">תאריך</label><input class="in" type="date" name="date" value="${esc(r.date)}" required style="margin-bottom:10px"><label class="f">עדכון</label><textarea class="in" name="text" rows="6" required>${esc(r.text)}</textarea>`,
        onOk: fd => { const q = curP(); if (q) upd(q, {reports:(q.reports||[]).map(x => x.id === r.id ? Object.assign({}, x, {date:fd.date, text:fd.text.trim()}) : x)}); }}); },
  delrep: el => { const p = curP(); if (p) confirmOv('למחוק את דוח הסטטוס הזה?', () => { const q = curP(); if (q) upd(q, {reports:(q.reports||[]).filter(x => x.id !== el.dataset.rid)}); }); },
  dldoc: el => { const p = curP(); const d = p && (p.docs||[]).find(x => x.id === el.dataset.did); if (d) viewDoc(d, true); },
  markdone: (el, e) => { e.stopPropagation(); setDone(el.dataset.id, true); },
  reopen: (el, e) => { e.stopPropagation(); setDone(el.dataset.id, false); },
  deltask: el => { const p = curP(); if (p) upd(p, {subtasks:(p.subtasks||[]).filter(t => t.id !== el.dataset.tid)}); },
  upload: () => $('#fileIn').click(),
  viewdoc: el => { const p = curP(); const d = p && (p.docs||[]).find(x => x.id === el.dataset.did); if (d) viewDoc(d); },
  logout: async () => { if (fbAuth) await fbAuth.signOut(); location.reload(); },
  deldoc: el => { const p = curP(); const d = p && (p.docs||[]).find(x => x.id === el.dataset.did); if (!d) return;
      confirmOv(`למחוק את "${d.name}"?`, async () => { const q = curP() || p; await upd(q, {docs:(q.docs||[]).filter(x => x.id !== d.id)}); if (d.fid) deleteFile(d.fid); }); },
  copy: el => copyText(el.dataset.t),
  day: el => { UI.cal.sel = el.dataset.d; const d = parseD(el.dataset.d); UI.cal.y = d.getFullYear(); UI.cal.m = d.getMonth(); renderOv(); },
  mon: el => { const k = +el.dataset.d; if (!k){ UI.cal = null; } else { const d = new Date(UI.cal.y, UI.cal.m + k, 1); UI.cal.y = d.getFullYear(); UI.cal.m = d.getMonth(); } renderOv(); },
  delev: el => Store.remove('events', el.dataset.id),
  deldir: el => { const c = S.directory.find(x => x.id === el.dataset.id); if (c) confirmOv(`למחוק את ${c.name} מאנשי הקשר?`, () => { Store.remove('directory', c.id); setTimeout(() => openOv('directory'), 0); }); }
};
document.addEventListener('click', e => {
  if (e.target.id === 'ov'){ closeOv(); return; }
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  if (S.ro && !READONLY_OK.has(el.dataset.a)) return;
  A[el.dataset.a] && A[el.dataset.a](el, e);
});
document.addEventListener('toggle', e => { if (e.target.id === 'dirAdd') UI.dirAddOpen = e.target.open; }, true);
document.addEventListener('toggle', e => { if (e.target.classList && e.target.classList.contains('arch')) UI.archOpen = e.target.open; }, true);
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'newKind'){ const v = el.value === 'וילה'; const n = $('#villaNote'), u = $('#newUrgBox'), o = $('#newKindOther'); if (n) n.style.display = v ? '' : 'none'; if (u) u.style.visibility = v ? 'hidden' : ''; if (o){ o.style.display = el.value === 'אחר' ? '' : 'none'; if (el.value === 'אחר') o.querySelector('input').focus(); } return; }
  if (el.id === 'docProject'){ const p = S.projects.find(x => x.id === el.value); const t = tplById(el.form.dataset.t); if (p && t) t.sections.forEach(sec => sec.fields.forEach(f => { if (f.from && p[f.from]){ const i = el.form.querySelector(`[name="${f.k}"]`); if (i) i.value = p[f.from]; } })); return; }
  if (el.id === 'fileIn'){ const p = curP(); if (p) upload([...el.files], p.id); el.value = ''; return; }
  const p = curP(); if (!p) return;
  if (el.dataset.pf === 'name'){ const dup = nameTaken(el.value, p.id); if (dup){ render(); dupWarning(el.value, dup, () => {}); return; } }
  if (el.dataset.pf === 'startDate' && el.value && isVilla(p) && p.deadline === addMonths(projStart(p), VILLA_MONTHS)){
    upd(p, {startDate: el.value, deadline: addMonths(el.value, VILLA_MONTHS)}); toast(`תאריך הפתיחה עודכן — היעד הסטנדרטי עודכן ל-${fmtD(addMonths(el.value, VILLA_MONTHS))}`); return; }
  if (el.dataset.pf === 'kind' && el.value === 'וילה' && !p.deadline){ upd(p, {kind:'וילה', urgency:'', deadline: addMonths(projStart(p), VILLA_MONTHS)}); toast(`יעד סטנדרטי לווילה נקבע ל-${fmtD(addMonths(projStart(p), VILLA_MONTHS))}`); return; }
  if (el.dataset.pf){ let v = el.value.trim(); if (el.dataset.pf === 'name' && !v){ render(); return; } if (el.dataset.num) v = v === '' ? null : Math.max(0, Number(v)); if (getPath(p, el.dataset.pf) === v) return; upd(p, nest(el.dataset.pf.split('.'), v)); }
  if (el.dataset.tdone){
    const done = el.checked, id = el.dataset.tdone;
    upd(p, {subtasks:(p.subtasks||[]).map(t => t.id === id ? Object.assign({}, t, {done, doneAt: done ? Date.now() : null}) : t)});
    toast(done ? 'המשימה בוצעה ועברה לארכיון' : 'המשימה חזרה לרשימה הפתוחה');
  }
  if (el.dataset.xc){ const v = el.value.trim(); upd(p, {extraContacts:(p.extraContacts||[]).map(c => c.id === el.dataset.xc ? Object.assign({}, c, {[el.dataset.xf]:v}) : c)}); return; }
  if (el.dataset.tdate) upd(p, {subtasks:(p.subtasks||[]).map(t => t.id === el.dataset.tdate ? Object.assign({}, t, {deadline:el.value}) : t)});
});
document.addEventListener('submit', e => {
  if (e.target.id === 'docForm'){ e.preventDefault(); submitDoc(e.target); return; }
  if (e.target.id === 'quoteForm'){ e.preventDefault(); submitQuote(); return; }
  const f = e.target; if (!f.dataset.f) return; e.preventDefault();
  const fd = Object.fromEntries(new FormData(f)); const p = curP();
  if (f.dataset.f === 'task' && p){ const title = fd.title.trim(); if (!title) return;
    upd(p, {subtasks:(p.subtasks||[]).concat({id:rid(), title, deadline:fd.deadline||'', done:false})});
    setTimeout(() => { const i = document.querySelector('[data-f=task] [name=title]'); if (i) i.focus(); }, 30); }
  if (f.dataset.f === 'xc' && p){ const c = {id:rid(), role:fd.role.trim(), name:fd.name.trim(), phone:fd.phone.trim(), email:(fd.email||'').trim()}; if (!c.role) return;
    upd(p, {extraContacts:(p.extraContacts||[]).concat(c)}); toast('איש הקשר נוסף'); }
  if (f.dataset.f === 'report' && p){ const text = (fd.text||'').trim(); if (!text) return;
    const by = fbAuth && fbAuth.currentUser && fbAuth.currentUser.email ? fbAuth.currentUser.email.split('@')[0] : '';
    upd(p, {reports:(p.reports||[]).concat({id:rid(), date:fd.date || today(), text, by, at:Date.now()})}); toast('דוח הסטטוס נשמר'); }
  if (f.dataset.f === 'event'){ Store.set('events', Store.newId('events'), {title:fd.title.trim(), date:UI.cal.sel, time:fd.time||'', projectId:fd.projectId||'', createdAt:Date.now()}); toast('הפגישה נוספה ליומן'); }
  if (f.dataset.f === 'dir'){ UI.dirAddOpen = false; Store.set('directory', Store.newId('directory'), {name:fd.name.trim(), role:fd.role.trim(), phone:fd.phone.trim(), email:fd.email.trim(), createdAt:Date.now()}); f.reset(); toast('איש הקשר נוסף'); }
});
document.addEventListener('input', e => {
  const qp = e.target.dataset && e.target.dataset.q;
  if (qp && UI.q){ setQPath(qp, e.target.value); saveQDraft(); updateQuoteCalc(); return; }
});
document.addEventListener('change', e => {
  if (e.target.dataset && e.target.dataset.q === 'projectId' && UI.q){
    const p = S.projects.find(x => x.id === e.target.value); UI.q.projectId = e.target.value;
    if (p){ if (!UI.q.toName.trim() && p.clientName) UI.q.toName = p.clientName; if (!UI.q.address.trim() && p.location) UI.q.address = p.location; }
    saveQDraft(); rerenderQuote();
  }
});
document.addEventListener('input', e => { if (e.target.id === 'dirQ'){ UI.dirQ = e.target.value; $('#dirList').innerHTML = dirList(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ovKind) closeOv(); });
/* חיפוש פרויקטים לפי שם */
function searchHits(q){
  q = normName(q); if (!q) return [];
  const score = p => { const n = normName(p.name); return n.startsWith(q) ? 0 : n.includes(q) ? 1 : 2; };
  return S.projects.filter(p => normName(p.name).includes(q) || normName(p.clientName).includes(q) || normName(p.location).includes(q))
    .sort((a,b) => score(a) - score(b) || (a.done - b.done) || String(a.name).localeCompare(String(b.name), 'he')).slice(0, 10);
}
function renderSearch(){
  const i = $('#pq'), box = $('#pqres'); if (!i || !box) return;
  const q = i.value.trim(); if (!q){ box.classList.add('hidden'); return; }
  const hits = searchHits(q);
  box.innerHTML = hits.length ? hits.map((p, k) => `<button type="button" class="${k===0?'hl':''}" data-a="pqgo" data-id="${esc(p.id)}"><b>${esc(p.name)}</b>
      <span class="muted">${isInsp(p) ? '🔍 אישורים ובדיקות' : p.done ? '✓ הושלם' : `שלב ${(p.stage||0)+1}: ${STAGES[p.stage||0].tab}`}${p.location ? ' · ' + esc(p.location) : ''}</span></button>`).join('')
    : '<div class="muted sm" style="padding:12px">לא נמצאו פרויקטים בשם הזה</div>';
  box.classList.remove('hidden');
}
document.addEventListener('input', e => { if (e.target.id === 'pq') renderSearch(); });
document.addEventListener('keydown', e => {
  if (e.target.id !== 'pq') return;
  if (e.key === 'Enter'){ const f = document.querySelector('#pqres [data-a=pqgo]'); if (f){ e.preventDefault(); f.click(); } }
  if (e.key === 'Escape'){ e.target.value = ''; renderSearch(); }
});
document.addEventListener('click', e => { if (!e.target.closest('.psearch')){ const b = $('#pqres'); if (b) b.classList.add('hidden'); } });
document.addEventListener('focusin', e => { if (e.target.id === 'pq') renderSearch(); });

render();
Store.init().then(render);
</script>
</body>
